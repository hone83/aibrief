# 매일 한 번 브리핑을 만들어 커밋하고 메일로 보낸다.
# public 저장소에서는 이 실행이 전부 무료이고, 실행 로그는 누구나 볼 수 있다.
# 따라서 로그에 응답 원문을 출력하지 않는다 (run.py는 건수만 찍는다).
name: 데일리 브리핑

on:
  schedule:
    # cron은 항상 UTC로 해석된다. 그리고 GitHub의 무료 예약은 정시를 보장하지 않는다 —
    # 혼잡하면 수십 분씩 밀리고, 아예 한 번 거르기도 한다. 그래서 아침에 세 번 건다.
    # 먼저 성공한 실행이 그날의 브리핑이 되고, 나머지는 --skip-if-done 때문에
    # 파일만 확인하고 즉시 끝난다 (메일도 다시 가지 않는다).
    - cron: "20 22 * * *"   # 07:20 KST — 본 실행
    - cron: "10 23 * * *"   # 08:10 KST — 1차 보험
    - cron: "15 0 * * *"    # 09:15 KST — 2차 보험
  workflow_dispatch:        # 액션 탭에서 수동 실행 버튼

# 워크플로가 저장소에 커밋을 하려면 쓰기 권한이 필요하다.
# 기본값은 읽기 전용이라 이 줄이 없으면 push가 403으로 실패한다.
permissions:
  contents: write

concurrency:
  # 이전 실행이 아직 돌고 있으면 새 실행이 기다리게 한다.
  # 두 실행이 동시에 커밋하면 push가 충돌한다.
  group: daily-brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip      # 매번 pip install을 새로 하지 않도록 캐시

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 브리핑 생성 및 발송
        env:
          # Settings → Secrets and variables → Actions 에서 등록한 값들.
          # 여기 적힌 이름만 보이고, 실제 값은 로그에서 자동으로 가려진다.
          # 번역 엔진 키. scoring.yaml에서 고른 엔진의 것만 있으면 된다.
          # 없으면 번역만 건너뛰고 원문으로 발행된다 — 브리핑은 멈추지 않는다.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # 모델 순위표. 없으면 순위 탭만 비고 브리핑은 그대로 나간다.
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 예약으로 돈 실행에만 "이미 있으면 건너뛰기"를 붙인다.
          # 손으로 누른 실행(workflow_dispatch)은 다시 만들려는 의도이므로 그대로 돈다.
          EXTRA: ${{ github.event_name == 'schedule' && '--skip-if-done' || '' }}
        run: python run.py $EXTRA

      - name: 결과 커밋
        run: |
          git config user.name  "brief-bot"
          git config user.email "brief-bot@users.noreply.github.com"
          # 첫 실행이라 폴더가 아직 없을 수 있다. 없는 경로를 add하면 에러가 난다.
          mkdir -p data docs
          git add -A data docs
          # 변경이 없으면 commit이 실패 코드를 뱉는다.
          # 그건 정상 상황이므로 워크플로를 실패로 만들지 않는다.
          git diff --staged --quiet || git commit -m "brief: $(date -u +%Y-%m-%d)"
          # 내가 설정 파일을 고쳐 push한 직후에 이 실행이 끝나면, 저장소가 이미
          # 한 발 앞서 있어서 그냥 push하면 거부당한다. 최신 내용을 받아 그 위에
          # 내 커밋을 얹은 뒤 보낸다.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
