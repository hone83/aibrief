# =============================================================================
#  비주얼 AI 데일리 브리핑 · 소스 레지스트리
#  이 파일 하나만 고치면 소스가 추가/제외/재분류된다. 코드는 건드리지 않는다.
#
#  추가 방법:  sources: 밑에 항목 하나 복사해서 붙여넣고 id/url/tier/topics 수정
#  잠깐 끄기:  enabled: false
#  검증:      python scripts/check_sources.py   (전 소스 호출 → 헬스 리포트 출력)
#
#  status 값의 의미
#    verified  : 실제 호출해서 정상 응답 확인
#    standard  : 플랫폼이 보장하는 표준 엔드포인트 (github releases.atom, youtube feeds)
#    unverified: 다음 실행 때 check_sources.py가 검증할 대상
#    stale     : 응답은 오지만 최신 항목이 오래됨 → 보조 소스 필요
#
#  type: html 은 '피드 주소를 모르는 사이트'라는 뜻이다. 수집기가 페이지를 열어
#  <link rel="alternate" type="application/rss+xml"> 을 찾고, 없으면 /feed, /rss.xml
#  같은 흔한 경로를 두드려 본다. 찾으면 그대로 수집되고, 못 찾으면 리포트에 남는다.
# =============================================================================

