  - id: arxiv-cv
    name: arXiv cs.CV (필터링)
    note: 전량이 아니라 키워드 매칭된 것만. video generation, diffusion, world model 등
    tier: T1
    topics: [video, image]
    type: arxiv
    query: "cat:cs.CV AND (abs:\"video generation\" OR abs:\"video diffusion\" OR abs:\"image generation\" OR abs:\"world model\")"
    max_items: 15
    # 초록을 길게 남긴다. "code is available at ..."이 대개 초록 맨 끝에 있어서,
    # 기본값 600자로 자르면 코드 공개 논문이 전부 미공개로 판정된다(실제로 그랬다).
    summary_limit: 2000
    # 위 질의가 이미 주제 필터 역할을 한다. 논문 제목은 "EchoWM"처럼 이름뿐이라
    # 제목 기반 주제 필터를 한 번 더 적용하면 전부 걸러진다(실제로 그랬다).
    skip_topic_filter: true
